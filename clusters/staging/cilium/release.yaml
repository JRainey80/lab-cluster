apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  releaseName: cilium
  targetNamespace: kube-system
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: "1.19.3"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  install:
    createNamespace: false

  values:
    cluster:
      name: default
    k8sServiceHost: 192.168.0.201
    k8sServicePort: 6443
    operator:
      replicas: 2
    routingMode: tunnel
    l2announcements:
      enabled: true
    k8sClientRateLimit:
      qps: 10
      burst: 20
